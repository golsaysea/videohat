<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoKit Core - Canvas GPU 渲染引擎</title>
    <style>
        /* 工业级暗黑 UI 设计 */
        :root { --bg: #0b0c10; --panel: #1f2833; --accent: #66fcf1; --text: #c5c6c7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 30px; font-size: 13px; }
        
        .header { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .header h1 { color: var(--accent); font-size: 26px; font-weight: 300; letter-spacing: 1px; }
        .badge { background: rgba(102, 252, 241, 0.1); color: var(--accent); padding: 4px 10px; border-radius: 4px; font-size: 12px; border: 1px solid var(--accent); vertical-align: middle; margin-left: 10px; font-weight: bold; }
        
        .app-container { display: flex; gap: 30px; max-width: 1400px; margin: 0 auto; align-items: flex-start; }
        @media (max-width: 900px) { .app-container { flex-direction: column; } }
        
        /* 左侧控制台 */
        .controls { flex: 1; max-width: 480px; background: var(--panel); border-radius: 8px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; color: #aaa; margin-bottom: 5px; font-size: 12px; }
        input[type="text"], input[type="number"], textarea { width: 100%; background: #0b0c10; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; transition: 0.3s; }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }
        textarea { height: 220px; resize: vertical; line-height: 1.5; font-family: Consolas, monospace; }
        
        .upload-btn { background: #111; color: #fff; padding: 15px; text-align: center; border: 1px dashed var(--accent); border-radius: 6px; cursor: pointer; position: relative; margin-bottom: 20px; transition: 0.2s; }
        .upload-btn:hover { background: #222; }
        .upload-btn input { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; }
        
        .btn-run { width: 100%; background: var(--accent); color: #000; font-weight: bold; font-size: 16px; padding: 15px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-run:disabled { background: #444; color: #777; cursor: not-allowed; }
        .btn-run:hover:not(:disabled) { box-shadow: 0 0 15px rgba(102, 252, 241, 0.4); }

        /* 右侧画布预览区 */
        .preview-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .canvas-wrapper { position: relative; width: 100%; max-width: 450px; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 1px solid #333; }
        /* 强制保持 9:16 物理比例视窗 */
        .canvas-wrapper::before { content: ""; display: block; padding-top: 177.77%; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .progress-bar { width: 100%; max-width: 450px; height: 4px; background: #222; margin-top: 15px; border-radius: 2px; overflow: hidden; }
        #prog { height: 100%; width: 0%; background: var(--accent); }
        
        #final-video { width: 100%; max-width: 450px; margin-top: 20px; border-radius: 10px; border: 2px solid var(--accent); display: none; }
        .log-box { margin-top: 15px; color: #aaa; font-family: monospace; font-size: 12px; padding: 10px; background: #000; border-radius: 4px; width: 100%; max-width: 450px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="controls">
        <div class="header">
            <h1>VideoKit Engine <span class="badge">Canvas Native 直录版</span></h1>
            <p>1:1 像素级复刻 reels-overlay 源码逻辑，0 内存爆炸风险</p>
        </div>

        <div class="upload-btn">
            <span id="file-name" style="font-weight: bold; font-size: 14px; color: var(--accent);">📥 点击加载无字幕原片</span>
            <input type="file" id="video-file" accept="video/*">
        </div>

        <div class="form-group">
            <label>📌 悬浮标题 (固定坐标，渲染独立图层)</label>
            <input type="text" id="cfg-title" value="In September, say this prayer!">
        </div>
        
        <div class="form-group">
            <label>📝 滚动主文案 (自动计算物理高度与折行)</label>
            <textarea id="cfg-body" spellcheck="false">1. God walks with me.
2. God guides my steps.
3. God has a beautiful plan for me.
4. I am protected from all evil.
5. Every challenge is a stepping stone.
6. My heart is full of peace.
7. I attract positive energy.
8. Today brings new opportunities.
9. I am grateful for everything I have.
10. The future is bright and clear.</textarea>
        </div>

        <div class="form-row">
            <div><label>正文字号 (px)</label><input type="number" id="cfg-size" value="65"></div>
            <div><label>正文宽度 (决定折行)</label><input type="number" id="cfg-width" value="900"></div>
        </div>
        
        <div class="form-row">
            <div><label>底部留白区 (Y偏置)</label><input type="number" id="cfg-bottom" value="150"></div>
            <div><label>提前完成 (秒)</label><input type="number" id="cfg-early" value="0.5" step="0.1"></div>
        </div>

        <div style="border-top: 1px solid #333; margin: 15px 0;"></div>
        
        <div class="form-row">
            <div><label>上羽化强度</label><input type="number" id="feather-top" value="300"></div>
            <div><label>上羽化偏移 (防遮挡标题)</label><input type="number" id="offset-top" value="480"></div>
        </div>
        <div class="form-row">
            <div><label>下羽化强度</label><input type="number" id="feather-bot" value="80"></div>
            <div><label>下羽化偏移 (距底部)</label><input type="number" id="offset-bot" value="0"></div>
        </div>

        <button id="btn-start" class="btn-run">🔥 启动实时硬件渲染</button>
        <button id="btn-preview" class="btn-run" style="background: #333; color: #fff; margin-top: 10px;">▶️ 仅在画布预览 (不导出)</button>
    </div>

    <div class="preview-area">
        <div class="canvas-wrapper">
            <!-- 核心渲染画板，严格 1080x1920 物理像素 -->
            <canvas id="render-canvas" width="1080" height="1920"></canvas>
        </div>
        <div class="progress-bar"><div id="prog"></div></div>
        <div class="log-box" id="log-out">系统就绪... 等待媒体流注入。</div>
        
        <video id="final-video" controls autoplay playsinline></video>
    </div>
</div>

<script>
    // ==========================================
    // 核心引擎：完美复刻 ReelsOverlay Canvas API
    // ==========================================

    const canvas = document.getElementById('render-canvas');
    const ctx = canvas.getContext('2d');
    
    // 离屏画布：专门用于绘制滚动文字并应用原生羽化遮罩
    const textCanvas = document.createElement('canvas');
    textCanvas.width = 1080;
    textCanvas.height = 1920;
    const tCtx = textCanvas.getContext('2d');

    // 隐藏的源视频播放器
    const video = document.createElement('video');
    video.crossOrigin = 'anonymous';
    video.playsInline = true;

    // 状态管理
    let isRendering = false;
    let isRecording = false;
    let animId;
    let mediaRecorder;
    let chunks = [];
    let p = {}; 
    
    // Web Audio API 音轨路由
    let audioCtx, sourceNode, destNode;

    // 1. 本地媒体流挂载
    document.getElementById('video-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.load();
            document.getElementById('file-name').innerText = `✅ 媒体已挂载: ${file.name}`;
            log(`视频流解析成功。`);
            
            // 初始化第一帧
            video.onloadeddata = () => {
                video.currentTime = 0.1; 
                setTimeout(drawFrame, 100); 
            };
        }
    });

    const log = (msg) => document.getElementById('log-out').innerHTML = `> ${msg}`;

    // 2. 文本自动折行探针 (_drawScrollTextBlock 核心逻辑)
    function wrapText(context, text, maxWidth) {
        const words = text.replace(/\n/g, ' \n ').split(' ');
        let lines = [];
        let currentLine = '';
        for (let i = 0; i < words.length; i++) {
            if (words[i] === '\n') {
                lines.push(currentLine); currentLine = ''; continue;
            }
            let testLine = currentLine + words[i] + ' ';
            let metrics = context.measureText(testLine);
            if (metrics.width > maxWidth && currentLine !== '') {
                lines.push(currentLine); currentLine = words[i] + ' ';
            } else {
                currentLine = testLine;
            }
        }
        lines.push(currentLine);
        return lines;
    }

    // 3. 启动引擎 (包含录制)
    document.getElementById('btn-start').addEventListener('click', () => startEngine(true));
    document.getElementById('btn-preview').addEventListener('click', () => startEngine(false));

    function startEngine(record) {
        if (!video.src) return alert("防呆拦截：请先在左侧上传原视频文件。");
        
        isRecording = record;
        document.getElementById('final-video').style.display = 'none';

        // 捕获 UI 参数
        p = {
            title: document.getElementById('cfg-title').value,
            bodyText: document.getElementById('cfg-body').value,
            fSize: parseInt(document.getElementById('cfg-size').value),
            tWidth: parseInt(document.getElementById('cfg-width').value),
            bMargin: parseInt(document.getElementById('cfg-bottom').value),
            earlyFin: parseFloat(document.getElementById('cfg-early').value),
            fTop: parseInt(document.getElementById('feather-top').value),
            oTop: parseInt(document.getElementById('offset-top').value),
            fBot: parseInt(document.getElementById('feather-bot').value),
            oBot: parseInt(document.getElementById('offset-bot').value),
            totalDuration: video.duration
        };
        p.lHeight = p.fSize * 1.4; // 动态行高

        // === 音频路由黑科技：捕获视频源声并混入录制流 ===
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioCtx.createMediaElementSource(video);
            destNode = audioCtx.createMediaStreamDestination();
            sourceNode.connect(destNode); // 路由给录制器
            sourceNode.connect(audioCtx.destination); // 路由给扬声器(预览发声)
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (isRecording) {
            const stream = canvas.captureStream(30); // 30帧视频流
            const audioTracks = destNode.stream.getAudioTracks();
            if (audioTracks.length > 0) stream.addTrack(audioTracks[0]); // 注入音轨

            // 探针：寻找当前浏览器支持的最佳编码器 (首选 MP4，兜底 WebM)
            let mimeType = 'video/webm'; 
            if (MediaRecorder.isTypeSupported('video/mp4')) mimeType = 'video/mp4';
            else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) mimeType = 'video/webm;codecs=vp9';

            chunks = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: mimeType });
                const finalVid = document.getElementById('final-video');
                finalVid.src = URL.createObjectURL(blob);
                finalVid.style.display = 'block';
                log('🎉 压制圆满落幕！已在下方生成高清成品，右键或长按视频即可保存。');
                toggleButtons(false);
            };
            mediaRecorder.start();
        }

        toggleButtons(true);
        log(isRecording ? '🚀 录制管线已启动，请耐心观看一遍视频，结束后自动出片...' : '▶️ 实时预览渲染中...');
        
        video.currentTime = 0;
        video.play();
        isRendering = true;
        renderLoop();
    }

    function toggleButtons(disabled) {
        document.getElementById('btn-start').disabled = disabled;
        document.getElementById('btn-preview').disabled = disabled;
    }

    // 引擎停止挂钩
    video.addEventListener('ended', () => {
        isRendering = false;
        cancelAnimationFrame(animId);
        if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        } else if (!isRecording) {
            toggleButtons(false);
            log('预览结束。');
        }
    });

    // ==========================================
    // 4. 核心渲染图层矩阵 (_drawScrollOverlay)
    // ==========================================
    function renderLoop() {
        if (!isRendering) return;
        drawFrame();
        animId = requestAnimationFrame(renderLoop);
    }

    function drawFrame() {
        // [底层] 绘制原始视频源 (自适应裁切居中)
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 1080, 1920);
        if (video.videoWidth) {
            const scale = Math.max(1080 / video.videoWidth, 1920 / video.videoHeight);
            const w = video.videoWidth * scale;
            const h = video.videoHeight * scale;
            ctx.drawImage(video, (1080 - w) / 2, (1920 - h) / 2, w, h);
        }
        
        tCtx.clearRect(0, 0, 1080, 1920);

        // [数学核心] 动态计算排版与滚动坐标
        tCtx.font = `bold ${p.fSize}px Arial, sans-serif`;
        const lines = wrapText(tCtx, p.bodyText, p.tWidth);
        const textH = lines.length * p.lHeight;
        
        const startY = 1920 + p.fSize; 
        const endY = 1920 - p.bMargin - textH; 
        
        const moveD = Math.max(1, p.totalDuration - p.earlyFin);
        const progress = Math.min(1, video.currentTime / moveD); 
        const currentY = startY - (startY - endY) * progress;

        // [排版] 在离屏画板绘制滚动文本 (复刻 _drawScrollTextBlock)
        tCtx.textAlign = 'center';
        tCtx.textBaseline = 'top';
        
        // 极品硬件级发光阴影与描边
        tCtx.shadowColor = 'rgba(0,0,0,0.85)';
        tCtx.shadowBlur = 12;
        tCtx.shadowOffsetX = 3;
        tCtx.shadowOffsetY = 4;
        
        let lineY = currentY;
        for (let line of lines) {
            if (line.trim() !== '') {
                tCtx.lineWidth = Math.max(4, p.fSize * 0.1); // 自适应描边粗细
                tCtx.strokeStyle = 'black';
                tCtx.strokeText(line, 540, lineY);
                tCtx.fillStyle = 'white';
                tCtx.fillText(line, 540, lineY);
            }
            lineY += p.lHeight;
        }

        // [最强黑科技] 应用 Canvas Alpha 原生渐变羽化遮罩 (性能零损耗)
        applyFeatherMask(tCtx, p.fTop, p.oTop, p.fBot, p.oBot);

        // [合成] 将羽化处理后的纯文字层，完美盖在视频上
        ctx.drawImage(textCanvas, 0, 0);

        // [顶层] 独立绘制绝对固定的标题 (不受羽化和裁切影响)
        if (p.title) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.font = `bold 72px Arial, sans-serif`;
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 4;
            ctx.shadowOffsetY = 5;
            ctx.lineWidth = 7;
            ctx.strokeStyle = 'black';
            ctx.strokeText(p.title, 540, p.oTop - 90); // 浮在顶部羽化线之上
            ctx.fillStyle = '#FFFFFF'; 
            ctx.fillText(p.title, 540, p.oTop - 90);
        }

        // 更新底部的进度条
        document.getElementById('prog').style.width = `${(video.currentTime / p.totalDuration) * 100}%`;
    }

    // 真正的无损透明度擦除算法 (Feathering)
    function applyFeatherMask(ctxLayer, tF, tO, bF, bO) {
        // destination-in: 只保留与新图形重叠的部分，并且继承新图形的透明度 (Alpha)
        ctxLayer.globalCompositeOperation = 'destination-in'; 
        const grad = ctxLayer.createLinearGradient(0, 0, 0, 1920);
        
        // 顶部透明渐变
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        if (tO > 0) grad.addColorStop(tO / 1920, 'rgba(0,0,0,0)');
        if (tO + tF > 0) grad.addColorStop((tO + tF) / 1920, 'rgba(0,0,0,1)');
        
        // 底部透明渐变
        const bStart = 1920 - bO - bF;
        const bEnd = 1920 - bO;
        grad.addColorStop(bStart / 1920, 'rgba(0,0,0,1)');
        grad.addColorStop(bEnd / 1920, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        
        ctxLayer.fillStyle = grad;
        ctxLayer.fillRect(0, 0, 1080, 1920);
        
        // 恢复正常画笔模式，以防影响下一帧
        ctxLayer.globalCompositeOperation = 'source-over'; 
    }
</script>
</body>
</html>
