<!DOCTYPE html>
<html>
<head>
    <title>Web视频自动化工坊</title>
    <!-- 引入 Web 版本的 FFmpeg -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.0/dist/ffmpeg.min.js"></script>
</head>
<body style="background:#1e1e1e; color:white; font-family:sans-serif; padding:30px;">
    <h3>导入素材进行本地压制</h3>
    <input type="file" id="uploader" accept="video/*">
    <button id="start-btn" disabled>执行压制队列</button>
    <p id="message" style="color:#00ff00;">等待导入媒体素材...</p>
    <video id="output-video" controls style="display:none; max-width:400px; border:2px solid #555;"></video>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        // 开启 log 以在浏览器 F12 控制台查看底层压制日志
        const ffmpeg = createFFmpeg({ log: true });
        
        const uploader = document.getElementById('uploader');
        const startBtn = document.getElementById('start-btn');
        const message = document.getElementById('message');
        const outputVideo = document.getElementById('output-video');
        let videoFile;

        uploader.addEventListener('change', (e) => {
            videoFile = e.target.files[0];
            startBtn.disabled = false;
            message.innerHTML = `已加载: ${videoFile.name}，点击执行`;
        });

        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            message.innerHTML = "正在加载 WebAssembly 引擎...";
            
            if (!ffmpeg.isLoaded()) await ffmpeg.load();
            
            message.innerHTML = "正在压制中，请查看 F12 控制台获取进度...";
            
            // 将本地文件挂载到 WASM 内存中
            ffmpeg.FS('writeFile', videoFile.name, await fetchFile(videoFile));
            
            // 执行压制参数 (例如快速预设、调整码率)
            await ffmpeg.run('-i', videoFile.name, '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '28', 'output.mp4');
            
            message.innerHTML = "自动化队列处理完成！";
            
            // 从内存中读取合成后的文件并渲染到播放器
            const data = ffmpeg.FS('readFile', 'output.mp4');
            const videoUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            
            outputVideo.src = videoUrl;
            outputVideo.style.display = 'block';
            startBtn.disabled = false;
        });
    </script>
</body>
</html>
