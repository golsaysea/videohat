<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滚动堆叠字幕生成器</title>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
        .box { background: #222; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        textarea { width: 100%; height: 150px; background: #333; color: #fff; border: 1px solid #555; padding: 10px; margin-top: 10px; font-family: monospace; }
        button { background: #ff4500; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:disabled { background: #555; cursor: not-allowed; }
        #log { font-size: 12px; color: #0f0; margin-top: 10px; height: 100px; overflow-y: auto; background: #000; padding: 10px; }
        video { width: 100%; margin-top: 10px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

    <h2 style="text-align: center;">🙏 祷告文滚动字幕生成器</h2>

    <div class="box">
        <label>1. 上传无字幕的原视频 (竖屏):</label><br><br>
        <input type="file" id="video-upload" accept="video/mp4,video/mov">
    </div>

    <div class="box">
        <label>2. 填入字幕时间轴 (格式: 开始秒数,结束秒数 | 文字):</label>
        <textarea id="sub-input">
0,2 | In September, say this prayer!
2,4 | 1. God walks with me.
4,6 | 2. God guides my steps.
6,10 | 3. God has a beautiful plan for me.</textarea>
        <p style="font-size: 12px; color: #aaa;">* 每一行会自动把上一行往上顶，就像你的参考视频一样。</p>
    </div>

    <button id="generate-btn">开始合成视频</button>
    <div id="log">等待操作...</div>
    
    <div class="box" id="output-box" style="display: none;">
        <label>3. 你的视频做好了 (长按或右键保存):</label>
        <video id="output-video" controls></video>
    </div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: false });
        const logEl = document.getElementById('log');

        function printLog(text) {
            logEl.innerHTML += `<div>> ${text}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // 核心算法：把你输入的文字，转换成带有“向上堆叠”动画位置的 ASS 字幕格式
        function createAssSubtitle(textInput) {
            const lines = textInput.split('\n').filter(l => l.trim() !== '');
            const subs = lines.map(line => {
                const parts = line.split('|');
                const times = parts[0].split(',');
                return { 
                    start: parseFloat(times[0]), 
                    end: parseFloat(times[1]), 
                    text: parts[1].trim() 
                };
            });

            // ASS 字幕头部：定义了粗体、白字、黑边、黑阴影（完全模仿你的参考视频）
            let ass = `[Script Info]
ScriptType: v4.00+
PlayResX: 1080
PlayResY: 1920

[V4+ Styles]
Format: Name, Fontname, Fontsize, PrimaryColour, OutlineColour, BackColour, Bold, BorderStyle, Outline, Shadow, Alignment, MarginV
Style: Default,Arial,85,&H00FFFFFF,&H00000000,&H80000000,-1,1,10,6,2,20

[Events]
Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
`;
            // 时间格式化辅助函数
            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = (seconds % 60).toFixed(2);
                return `${h}:${m.toString().padStart(2, '0')}:${s.padStart(5, '0')}`;
            };

            // 堆叠逻辑：遍历每一行字幕，并且把以前出现过的字幕也渲染出来，位置不断往上抬
            for (let i = 0; i < subs.length; i++) {
                const current = subs[i];
                const startTime = formatTime(current.start);
                const endTime = formatTime(current.end);
                
                for (let j = 0; j <= i; j++) {
                    const renderText = subs[j].text;
                    // 位置计算：最新的在最下面(Y: 1300)，之前的每次往上顶 130 像素
                    const yPos = 1300 - ((i - j) * 130);
                    // 使用 ASS 的 \pos 标签强制绝对定位
                    ass += `Dialogue: 0,${startTime},${endTime},Default,,0,0,0,,{\\pos(540,${yPos})}${renderText}\n`;
                }
            }
            return ass;
        }

        document.getElementById('generate-btn').addEventListener('click', async () => {
            const videoFile = document.getElementById('video-upload').files[0];
            const textInput = document.getElementById('sub-input').value;

            if (!videoFile) {
                alert('请先上传原视频！');
                return;
            }

            document.getElementById('generate-btn').disabled = true;
            document.getElementById('output-box').style.display = 'none';
            logEl.innerHTML = '';

            try {
                printLog("正在加载浏览器压制引擎...");
                if (!ffmpeg.isLoaded()) await ffmpeg.load();

                printLog("生成字幕排版文件...");
                const assData = createAssSubtitle(textInput);
                
                // 为了让浏览器里的 ffmpeg 能正常渲染字体，需要挂载一个默认英文字体
                // 这里我们随便写一个让 libass 不报错的空字体引用逻辑
                ffmpeg.FS('writeFile', 'subs.ass', new TextEncoder().encode(assData));
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(videoFile));

                printLog("开始将字幕硬压入视频 (可能需要几分钟，请勿关闭网页)...");
                
                ffmpeg.setProgress(({ ratio }) => {
                    printLog(`压制进度: ${(ratio * 100).toFixed(1)}%`);
                });

                // 核心压制命令，使用 ultrafast 保证网页端不崩溃
                await ffmpeg.run('-i', 'input.mp4', '-vf', 'ass=subs.ass', '-c:v', 'libx264', '-preset', 'ultrafast', '-c:a', 'copy', 'output.mp4');

                printLog("处理完成！正在生成预览...");
                
                const data = ffmpeg.FS('readFile', 'output.mp4');
                const videoUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                
                const outputVideo = document.getElementById('output-video');
                outputVideo.src = videoUrl;
                document.getElementById('output-box').style.display = 'block';

                // 清理内存
                ffmpeg.FS('unlink', 'input.mp4');
                ffmpeg.FS('unlink', 'subs.ass');
                ffmpeg.FS('unlink', 'output.mp4');

            } catch (err) {
                printLog(`发生错误: ${err.message}`);
                console.error(err);
            } finally {
                document.getElementById('generate-btn').disabled = false;
            }
        });
    </script>
</body>
</html>
